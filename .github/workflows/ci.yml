name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Generate templ templates
        run: go tool templ generate

      - name: Run unit tests
        env:
          XSRF: test-xsrf-key-for-testing
          JWT_KEY: test-access-key-for-testing
          JWT_REFRESH_KEY: test-refresh-key-for-testing
        run: go test -short -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage.out
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Generate templ templates
        run: go tool templ generate

      - name: Run integration tests
        env:
          XSRF: test-xsrf-key-for-testing
          JWT_KEY: test-access-key-for-testing
          JWT_REFRESH_KEY: test-refresh-key-for-testing
        run: go test -v -race ./tests/integration/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Generate templ templates
        run: go tool templ generate

      # Two constraints, both of which fail the job before a single file is
      # linted:
      #   - app/.golangci.yml is a version "2" config, which needs action v7+;
      #     v6 installs golangci-lint v1 and cannot parse it.
      #   - golangci-lint refuses to run when the Go it was built with is older
      #     than the go directive in go.mod (currently 1.25.6), so raising that
      #     directive means raising this pin too.
      # Pinned rather than "latest" so a new release cannot break the build
      # without a deliberate bump. The timeout lives in the config file.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ./app

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dviji-se:test -f app/Dockerfile app/
