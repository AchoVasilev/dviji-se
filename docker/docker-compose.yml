services:
  postgres:
    image: postgres:15
    container_name: postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: dvijise
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dvijise"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: dviji-se
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Names must match internal/config/config.go.
      PORT: "8080"
      ENVIRONMENT: development
      APP_BASE_URL: http://localhost:8080

      DBHOST: postgres
      DBPORT: "5432"
      DBUSER: postgres
      DBPASSWORD: postgres
      DBNAME: dvijise
      DBSSLMODE: disable
      DBCONNECTIONS: "10"

      # Local development values only - never reuse these anywhere else.
      JWT_KEY: local-dev-jwt-key
      JWT_REFRESH_KEY: local-dev-jwt-refresh-key
      XSRF: local-dev-xsrf-key

      CORS_ORIGINS: http://localhost:8080
      ALLOW_REGISTRATION: "true"
    restart: unless-stopped

volumes:
  postgres_data:
